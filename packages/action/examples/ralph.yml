# Copy to .github/workflows/ralph.yml in your repo.
name: Ralph

on:
  issues:
    types: [labeled]

# One agent per issue. Re-labelling while a run is in flight replaces it.
concurrency:
  group: ralph-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  implement:
    # The label your triage flow applies when an issue is fully specified
    # and safe to hand to an unattended agent.
    if: github.event.label.name == 'ready-for-agent'
    runs-on: self-hosted
    timeout-minutes: 60

    # On the default token, also enable Settings → Actions → General →
    # "Allow GitHub Actions to create and approve pull requests". It is off
    # on new repos and these permissions do not override it — see the README.
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      # Version tags never move. Bump this to pick up fixes; the releases
      # page says what changed. 0.x may break between minor versions.
      - uses: dtun/ralph-alpha/packages/action@v0.1.1
        with:
          # The action checks out for you, so a step of your own would run
          # before the repo exists. Install dependencies here instead.
          setup: npm ci
          verify: npm test
          timeout-minutes: 45

          # Pin the pack. An unpinned pack changes your agents' behaviour
          # with no diff in your repo.
          skills-repo: mattpocock/skills
          skills-ref: v1.1.0

          # The default GITHUB_TOKEN does not trigger pull_request workflows,
          # so CI will not run on Ralph's PRs and the PR says so. Pass a PAT
          # or a GitHub App token to get CI — see the README.
          # github-token: ${{ secrets.RALPH_PAT }}
